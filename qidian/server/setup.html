<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置 DeepSeek · 启点</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ai.css"></head><body><main><section class="input-card"><span class="eyebrow">仅在本机可用的配置入口</span><h1>连接 DeepSeek</h1><p>输入你自己的 DeepSeek API Key。点击保存时，会向 DeepSeek 验证密钥；验证成功后保存到本机项目的私密配置文件，供服务端调用。密钥不会写入网页、错题本或代码仓库。</p><p>API 使用会消耗你的 DeepSeek 账户余额。<a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener noreferrer">前往 DeepSeek 获取密钥</a></p><form id="setupForm"><label for="apiKey">DeepSeek API Key</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" required placeholder="sk-…"><button class="primary" id="saveKey" type="submit">验证并保存到本机</button></form><p id="setupResult" role="status"></p><a href="/">返回学习应用 →</a><p class="small">本机保存不会自动修改线上网站。线上发布时需要将同一密钥配置为网站的服务端密钥。</p></section></main><script src="/setup.js"></script></body></html>
